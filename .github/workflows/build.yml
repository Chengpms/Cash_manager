# Compila la app para Linux (AppImage + .deb), Windows (instalador + portable)
# y Android (APK). Se ejecuta en cada push a main (los archivos quedan como
# "artifacts" de la ejecución) y, al subir una etiqueta vX.Y.Z, además publica
# una Release de GitHub con todos los instaladores.
#
# Para que el APK se firme siempre con la misma clave (necesario para poder
# actualizar la app sin desinstalarla), crea estos secrets en el repositorio:
#   ANDROID_KEYSTORE_BASE64   -> base64 -w0 frontend/android/gestor-release.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sin ellos, el APK se firma con una clave de depuración temporal.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            target: dist:win
            files: |
              release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix frontend
      - run: npm ci --prefix desktop
      - run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --prefix frontend
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firmará con una clave de depuración temporal"
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run android:apk --prefix frontend
          VERSION=$(node -p "require('./frontend/package.json').version")
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "release/Gestor-de-Dinero-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/desktop-*/*
            artifacts/android/*
          generate_release_notes: true
